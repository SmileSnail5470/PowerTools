name: Build and Release with Nuitka

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os: [windows-latest, macos-latest, macos-15-intel]
        os: [windows-latest]
        arch: [x86_64, arm64]
        python-version: ["3.12"]
        exclude:
          # Windows 官方 runner 没有 ARM64
          - os: windows-latest
            arch: arm64
          # macOS 官方 runner 没有 x86_64
          - os: macos-latest
            arch: x86_64
          - os: macos-15-intel
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka==4.0.1
          pip install -r requirements.txt
        shell: bash

      - name: Remove problematic brew libs
        if: runner.os == 'macOS'
        run: |
          brew remove --force --ignore-dependencies openssl@3
          brew cleanup openssl@3

      - name: Generate Qt resources
        run: |
          pyside6-rcc app/ui/library/qfluentwidgets/_rc/resource.qrc -o app/ui/library/qfluentwidgets/_rc/resource.py
          pyside6-rcc app/ui/library/qframelesswindow/_rc/resource.qrc -o app/ui/library/qframelesswindow/_rc/resource.py
          pyside6-rcc app/ui/resources/resource.qrc -o app/ui/resources/resource.py
        shell: bash

      - name: Build
        if: runner.os != 'Windows'
        run: |
          python build.py --output-dir build
        shell: bash

      - name: Build (Windows with MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
            if exist "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" (
                set DEV_CMD="C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
            ) else if exist "C:\Program Files\Microsoft Visual Studio\2022\Professional\Common7\Tools\VsDevCmd.bat" (
                set DEV_CMD="C:\Program Files\Microsoft Visual Studio\2022\Professional\Common7\Tools\VsDevCmd.bat"
            ) else if exist "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\VsDevCmd.bat" (
                set DEV_CMD="C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\VsDevCmd.bat"
            ) else (
                echo "No MSVC DevCmd.bat found!"
                exit /b 1
            )

            echo Using MSVC DevCmd: %DEV_CMD%

            call %DEV_CMD% -arch=x64 -host_arch=x64 && ^
            python build.py --output-dir build

      - name: Reinstall openssl libs
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zipFile = "powertools-${{ matrix.os }}-${{ matrix.arch }}.zip"

          Remove-Item -Force $zipFile -ErrorAction SilentlyContinue

          Compress-Archive -Path "build\*" -DestinationPath $zipFile -Force

      - name: Package (Linux/macos)
        if: runner.os != 'Windows'
        run: |
          cd build
          zip -r ../powertools-${{ matrix.os }}-${{ matrix.arch }}.zip .
          cd ..
        shell: bash

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
            name: powertools-${{ matrix.os }}-${{ matrix.arch }}
            path: powertools-${{ matrix.os }}-${{ matrix.arch }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          repository: SmileSnail5470/PowerTools
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: artifacts/**/*.zip
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}